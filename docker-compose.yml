version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: my_rabbitmq
    hostname: "rabbit"
    ports:
      - "5672:5672"       
      - "15672:15672"    
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  prodcer-api:
    build: .
    container_name: my-producer
    command: python producer_api.py
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=kalo
      - RABBIT_PASS=kalo
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
  
  consumer-worker:
    build: .
    container_name: my-consumer
    command: python consumer_worker.py
    environment:
      - PYTHONUNBUFFERED=1
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=kalo
      - RABBIT_PASS=kalo
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app